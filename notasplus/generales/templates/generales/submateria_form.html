{% extends "generales/base.html" %}
{% block title %}Nueva sub-materia{% endblock %}
{% block content %}
<h1>Crear sub-materia para {{ materia.nombre }}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Guardar</button>
  <a href="{% url 'materia_detail' materia.pk %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
